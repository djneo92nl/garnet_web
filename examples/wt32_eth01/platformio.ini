; garnet_web on a WT32-ETH01 (ESP32 + LAN8720 Ethernet). Ethernet is the
; primary uplink; WiFi (and the setup AP) take over when the cable is out.
;
; Flashing: the board has no USB - use a 3.3 V USB-serial adapter on
; TX0/RX0 and hold IO0 low at reset.

[env:wt32_eth01]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = wt32-eth01
framework = arduino
monitor_speed = 115200
; WiFi + Bluedroid + web UI don't fit the default 1.3 MB app slot.
board_build.partitions = huge_app.csv
build_flags =
  -D GARNET_WEB_ETH
  -D GARNET_WEB_WIFI
  -D GARNET_WEB_BT
lib_deps =
  symlink://../../../garnet_settings
  symlink://../..
