; Storage firmware: the smallest useful thing to flash on a spare ESP32
; before it goes in the drawer. Wi-Fi + web UI + OTA, nothing else, so the
; same source builds for every Wi-Fi capable chip. Pick the env for your
; chip:  pio run -e esp32c3 -t upload
;
; Not included: ESP32-H2 (no Wi-Fi) and ESP32-P4 (no radio of its own).

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Two OTA slots of 1.25 MB in the first 4 MB - fits every module (bigger
; flash just goes unused until the real firmware brings its own table).
board_build.partitions = default.csv
board_upload.flash_size = 4MB
build_flags =
  -D GARNET_WEB_WIFI
  -D GARNET_WEB_OTA
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  symlink://../../../garnet_settings
  symlink://../..

[env:esp32]
board = esp32dev

[env:esp32s2]
board = esp32-s2-saola-1

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32c5]
board = esp32-c5-devkitc-1

[env:esp32c6]
board = esp32-c6-devkitc-1
