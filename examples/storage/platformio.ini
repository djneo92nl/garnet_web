; Storage firmware: the smallest useful thing to flash on a spare ESP32
; before it goes in the drawer. Wi-Fi + web UI + OTA, nothing else, so the
; same source builds for every Wi-Fi capable chip. Pick the env for your
; chip:  pio run -e esp32c3 -t upload
;
; Not included: ESP32-H2 (no Wi-Fi). The ESP32-P4 has no radio of its own
; either, but boards pair it with an ESP32-C6 (Wi-Fi via ESP-Hosted over
; SDIO) and usually add Ethernet - see env:esp32p4.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Two OTA slots of 1.25 MB in the first 4 MB - fits every module (bigger
; flash just goes unused until the real firmware brings its own table).
board_build.partitions = default.csv
board_upload.flash_size = 4MB
build_flags =
  -D GARNET_WEB_WIFI
  -D GARNET_WEB_OTA
  -D GARNET_WEB_FILES
  -D GARNET_WEB_TIME
  -D GARNET_WEB_LOG
  -D GARNET_WEB_HW
  -D GARNET_WEB_UART
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  symlink://../../../garnet_settings
  symlink://../..

[env:esp32]
board = esp32dev

[env:esp32s2]
board = esp32-s2-saola-1

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32c5]
board = esp32-c5-devkitc-1
; The C5's Wi-Fi 6 stack is ~40 KB bigger than the other chips', and its
; I2C + ADC drivers ~47 KB (vs ~25 KB elsewhere). With every tool the image
; doesn't fit default.csv's 1.25 MB slot, so Clock and Hardware are left
; out here; Files, Log, Serial and OTA stay.
build_flags =
  -D GARNET_WEB_WIFI
  -D GARNET_WEB_OTA
  -D GARNET_WEB_FILES
  -D GARNET_WEB_LOG
  -D GARNET_WEB_UART
  -D CORE_DEBUG_LEVEL=1

[env:esp32c6]
board = esp32-c6-devkitc-1

; ESP32-P4 boards on Espressif's reference layout (Function EV board,
; Waveshare ESP32-P4-NANO / -Module etc.): Wi-Fi through the on-board C6,
; Ethernet on the variant's RMII pins (IP101 PHY). The prebuilt core only
; supports P4 chip revisions below v3.0.
[env:esp32p4]
board = esp32-p4
; Console (Serial + the [storage] status line) on the P4's own USB port -
; the generic board definition would send it to UART0 on GPIO 37/38.
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D GARNET_WEB_WIFI
  -D GARNET_WEB_ETH
  -D GARNET_WEB_OTA
  -D GARNET_WEB_FILES
  -D GARNET_WEB_TIME
  -D GARNET_WEB_LOG
  -D GARNET_WEB_HW
  -D GARNET_WEB_UART
  -D CORE_DEBUG_LEVEL=1
