; garnet_web on the ESP32-2432S028R "Cheap Yellow Display": WiFi + BLE +
; SD card info. (Display/touch are left to garnet_ui - this example only
; shows the web side, with a Display group whose values a garnet_ui
; screen would read.)

[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -D GARNET_WEB_WIFI
  -D GARNET_WEB_BT
  -D GARNET_WEB_SD
lib_deps =
  symlink://../../../garnet_settings
  symlink://../..
