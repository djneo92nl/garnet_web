; garnet_web on an ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM),
; e.g. the common "ESP32-S3 WROOM CAM" boards: OV5640/OV3660 camera + SD slot
; (SDMMC, 1-bit). WiFi + BLE, no Ethernet.
;
; Build/flash from this folder:  pio run -t upload -t monitor

[env:esp32s3_camera]
; pioarduino = Arduino-ESP32 3.x (stock PlatformIO espressif32 is still 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N16R8 modules use octal PSRAM - without this the PSRAM stays invisible.
board_build.arduino.memory_type = qio_opi
build_flags =
  -D GARNET_WEB_WIFI
  -D GARNET_WEB_BT
  -D GARNET_WEB_SD
  -D GARNET_WEB_FILES
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
lib_deps =
  symlink://../../../garnet_settings
  symlink://../..
